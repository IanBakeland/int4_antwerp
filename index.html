<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Panorama met Gyroscoop</title>

    <!-- Pannellum CSS via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <!-- Pannellum JS via CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        #panorama {
            width: 100%;
            height: 100%;
            display: none;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .pano-ui {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
            display: none;
        }

        .pano-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            padding: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .pano-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            color: black;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <!-- Achtergrondmuziek -->
    <audio id="bgMusic" loop>
        <source src="natture.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay">
        <h2>360° Panorama Ervaring</h2>
        <p>Beweeg je telefoon om rond te kijken.</p>
        <button id="startButton">Start 360° Ervaring</button>
    </div>

    <div id="panorama"></div>

    <div id="pano-ui" class="pano-ui">
        <button id="muteBtn" class="pano-btn" title="Mute/Unmute">🔊</button>
        <button class="pano-btn" title="Like">❤️</button>
        <button class="pano-btn" title="Share">↗️</button>
    </div>

    <script>
        let viewer;
        let audioCtx;

        document.getElementById('startButton').addEventListener('click', function () {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startPanorama();
                        } else {
                            alert('Toestemming voor de gyroscoop is geweigerd. Je kunt wel navigeren met Touch.');
                            startPanorama();
                        }
                    })
                    .catch(console.error);
            } else {
                startPanorama();
            }
        });

        function startPanorama() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('panorama').style.display = 'block';
            document.getElementById('pano-ui').style.display = 'flex';

            const bgAudio = document.getElementById('bgMusic');

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const track = audioCtx.createMediaElementSource(bgAudio);

            const panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';
            
            panner.positionX.value = 0;
            panner.positionY.value = 0;
            panner.positionZ.value = -5;

            track.connect(panner).connect(audioCtx.destination);

            bgAudio.play().catch(error => {
                console.error("Audio kon niet gestart worden:", error);
            });

            viewer = pannellum.viewer('panorama', {
                "type": "equirectangular",
                "panorama": "pano.jpeg",
                "autoLoad": true,
                "orientationOnByDefault": true,
                "showControls": true
            });

            requestAnimationFrame(updateAudioListener);
        }

        document.getElementById('muteBtn').addEventListener('click', function () {
            const bgAudio = document.getElementById('bgMusic');
            if (bgAudio.muted) {
                bgAudio.muted = false;
                this.textContent = '🔊';
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } else {
                bgAudio.muted = true;
                this.textContent = '🔇';
            }
        });

        function updateAudioListener() {
            if (viewer && audioCtx) {
                let yaw = viewer.getYaw();
                let pitch = viewer.getPitch();

                let yawRad = yaw * Math.PI / 180;
                let pitchRad = pitch * Math.PI / 180;

                let fx = Math.sin(yawRad) * Math.cos(pitchRad);
                let fy = Math.sin(pitchRad);
                let fz = -Math.cos(yawRad) * Math.cos(pitchRad); 

                let px = Math.sin(yawRad) * Math.cos(pitchRad + Math.PI/2);
                let py = Math.sin(pitchRad + Math.PI/2);
                let pz = -Math.cos(yawRad) * Math.cos(pitchRad + Math.PI/2);

                const listener = audioCtx.listener;
                
                if(listener.forwardX !== undefined) {
                    listener.forwardX.value = fx;
                    listener.forwardY.value = fy;
                    listener.forwardZ.value = fz;
                    listener.upX.value = px;
                    listener.upY.value = py;
                    listener.upZ.value = pz;
                } else {
                    listener.setOrientation(fx, fy, fz, px, py, pz);
                }
            }
            
            requestAnimationFrame(updateAudioListener);
        }
    </script>
</body>
</html>
