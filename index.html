<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Panorama met Gyroscoop</title>

    <!-- Pannellum CSS via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <!-- Pannellum JS via CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        /* Setup voor een fullscreen layout */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        /* Container voor de panorama, verborgen totdat de gebruiker op start klikt */
        #panorama {
            width: 100%;
            height: 100%;
            display: none;
        }

        /* Overlay scherm met de start knop */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            z-index: 10;
        }

        /* Stijl voor de toestemmingsknop */
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Custom UI op de panorama */
        .pano-ui {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
            /* Dit zorgt dat het boven de panorama komt */
            display: none;
            /* Wordt getoond als panorama start */
        }

        .pano-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            padding: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .pano-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            color: black;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <!-- Achtergrondmuziek -->
    <audio id="bgMusic" loop>
        <source src="natture.mp3" type="audio/mpeg">
    </audio>

    <!-- De begin-overlay die toestemming gaat vragen/afvangen -->
    <div id="overlay">
        <h2>360° Panorama Ervaring</h2>
        <p>Beweeg je telefoon om rond te kijken.</p>
        <button id="startButton">Start 360° Ervaring</button>
    </div>

    <!-- Hier wordt de 360 panorama in gerenderd -->
    <div id="panorama"></div>

    <!-- UI Knoppen die we over de panorama kunnen gooien -->
    <div id="pano-ui" class="pano-ui">
        <button id="muteBtn" class="pano-btn" title="Mute/Unmute">🔊</button>
        <button class="pano-btn" title="Like">❤️</button>
        <button class="pano-btn" title="Share">↗️</button>
    </div>

    <script>
        // Luister naar een klik op de startknop
        document.getElementById('startButton').addEventListener('click', function () {
            // Controleer of de browser (zoals iOS Safari) vereist dat we toestemming vragen voor sensoren
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startPanorama();
                        } else {
                            alert('Toestemming voor de gyroscoop is geweigerd. Je kunt wel navigeren met Touch.');
                            startPanorama(); // Toch de foto laden, maar deviceOrientation zal niet werken
                        }
                    })
                    .catch(console.error);
            } else {
                // Geen expliciete toestemming nodig (Android of desktop)
                startPanorama();
            }
        });

        // Functie die Pannellum initialiseert nadat de muisklik is afgehandeld
        function startPanorama() {
            // Verberg de navigatie/toestemming overlay
            document.getElementById('overlay').style.display = 'none';

            // Toon de panorama viewer div
            document.getElementById('panorama').style.display = 'block';

            // Toon de custom UI buttons over de panorama
            document.getElementById('pano-ui').style.display = 'flex';

            // Start de achtergrondmuziek!
            const bgAudio = document.getElementById('bgMusic');
            bgAudio.play().catch(error => {
                console.error("Audio kon niet gestart worden:", error);
            });

            // Laad de Pannellum viewer in de div met id="panorama"
            pannellum.viewer('panorama', {
                "type": "equirectangular",
                "panorama": "pano.jpeg", // De bestandsnaam van jouw eigen foto
                "autoLoad": true,
                "orientationOnByDefault": true,  // Zorg dat de gyroscoop standaard wordt gebruikt als die aanwezig is
                "showControls": true             // Toon eventuele zoom/fullscreen knoppen
            });
        }

        // Logica voor de Mute/Unmute knop
        document.getElementById('muteBtn').addEventListener('click', function () {
            const bgAudio = document.getElementById('bgMusic');
            if (bgAudio.muted) {
                bgAudio.muted = false;
                this.textContent = '🔊';
            } else {
                bgAudio.muted = true;
                this.textContent = '🔇';
            }
        });
    </script>
</body>

</html>
